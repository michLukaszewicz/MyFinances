name: CI

on:
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: MyFinances/backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - run: dotnet build
      - run: dotnet test --no-build

  # Report-only (thresholds.break = 0 in Tests/stryker-config.json): never fails on score.
  # --since limits mutants to code changed in the PR, so base history must be fetched.
  mutation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - name: Restore tools
        working-directory: MyFinances/backend
        run: dotnet tool restore
      - name: Run Stryker (changed code only)
        working-directory: MyFinances/backend/Tests
        run: dotnet stryker --since:origin/${{ github.base_ref }} | tee "$RUNNER_TEMP/stryker.log"
      - name: Summarize mutation score
        if: always()
        run: |
          score=$(grep -a "final mutation score" "$RUNNER_TEMP/stryker.log" || echo "no mutants tested")
          echo "### Mutation testing (changed code only)" >> "$GITHUB_STEP_SUMMARY"
          echo "$score" >> "$GITHUB_STEP_SUMMARY"
      - name: Upload mutation report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mutation-report
          path: MyFinances/backend/Tests/StrykerOutput/**/reports/
          if-no-files-found: ignore

  # Browser-level tests. global-setup starts a throwaway postgres container (Docker is preinstalled
  # on ubuntu-latest) and migrates it; the API runs against that, never a real database.
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: MyFinances/frontend
    env:
      # Test-only credentials for the throwaway database; the test user is registered on it by the setup project.
      E2E_USERNAME: e2e@myfinances.test
      E2E_PASSWORD: e2e-ci-password-0123
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: MyFinances/frontend/package-lock.json
      - name: Install dotnet-ef (used by tests/e2e/global-setup.ts)
        run: |
          dotnet tool install --global dotnet-ef --version "10.0.*"
          echo "$HOME/.dotnet/tools" >> "$GITHUB_PATH"
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npx playwright test
      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            MyFinances/frontend/playwright-report/
            MyFinances/frontend/test-results/
          if-no-files-found: ignore
